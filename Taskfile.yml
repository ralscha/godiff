version: 3

vars:
  PACKAGE: ./...
  COVERAGE_FILE: coverage.out
  FUZZ_TIME: 10s

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the project
    cmds:
      - go build {{.PACKAGE}}

  fmt:
    desc: Format Go code
    cmds:
      - go fmt {{.PACKAGE}}

  lint:
    desc: Run golangci-lint in a Docker container
    cmds:
      - golangci-lint run -v --timeout 5m

  test:
    desc: Run all tests
    cmds:
      - go test {{.PACKAGE}} -v

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test {{.PACKAGE}} -coverprofile={{.COVERAGE_FILE}}

  fuzz:
    desc: Run all fuzz tests
    cmds:
      - task fuzz:strings
      - task fuzz:ints
      - task fuzz:slices
      - task fuzz:structs
      - task fuzz:maps
      - task fuzz:nils
      - task fuzz:options
      - task fuzz:time

  fuzz:strings:
    desc: Run string comparison fuzz tests
    cmds:
      - go test -fuzz=FuzzCompareStrings -fuzztime={{.FUZZ_TIME}} .

  fuzz:ints:
    desc: Run integer comparison fuzz tests
    cmds:
      - go test -fuzz=FuzzCompareInts -fuzztime={{.FUZZ_TIME}} .

  fuzz:slices:
    desc: Run slice comparison fuzz tests
    cmds:
      - go test -fuzz=FuzzCompareSlices -fuzztime={{.FUZZ_TIME}} .

  fuzz:structs:
    desc: Run struct comparison fuzz tests
    cmds:
      - go test -fuzz=FuzzCompareStructs -fuzztime={{.FUZZ_TIME}} .

  fuzz:maps:
    desc: Run map comparison fuzz tests
    cmds:
      - go test -fuzz=FuzzCompareMaps -fuzztime={{.FUZZ_TIME}} .

  fuzz:nils:
    desc: Run nil comparison fuzz tests
    cmds:
      - go test -fuzz=FuzzCompareWithNils -fuzztime={{.FUZZ_TIME}} .

  fuzz:options:
    desc: Run configured comparison fuzz tests
    cmds:
      - go test -fuzz=FuzzCompareWithOptions -fuzztime={{.FUZZ_TIME}} .

  fuzz:time:
    desc: Run time comparison fuzz tests
    cmds:
      - go test -fuzz=FuzzCompareTime -fuzztime={{.FUZZ_TIME}} .

  benchmark:
    desc: Run benchmarks with memory allocation stats
    cmds:
      - go test {{.PACKAGE}} -bench . -benchmem -run ^$

  demo:
    desc: Run the demo CLI application
    cmds:
      - go run ./cmd/demo

